      <span data-gender="">هدية إلى حسين</span>
      <span data-gender="🇯🇴👧 🇯🇴👦">هدية إلى حسين</span>
      <span data-gender="🇺🇸👧 🇺🇸👦">Gift for Hussein</span>
    </title>
    <style>
      @import url(https://fonts.googleapis.com/css2?family=Lemonada:wght@300..700&family=Martian+Mono:wght@100..800&display=swap);

      html,
      body {
        width: 100%;
        height: 100%;
        scrollbar-width: none;
        overflow: hidden;
        margin: 0;
      }

      /* الثيم الجديد: أصفر، برتقالي غامق، وأخضر متدرج ومموج */
      body {
        background: linear-gradient(135deg, #d35400 0%, #f39c12 25%, #27ae60 50%, #e67e22 75%, #1e5128 100%);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .name {
        font-size: 1.3rem;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff6600;
      }

      #cake {
        display: block;
        position: relative;
        margin: -10em auto 0 auto;
      }

      /* ============================================== Candle */
      .cake {
        background: #ffffff;
        border-radius: 10px;
        position: absolute;
        top: 229px;
        left: 50%;
        margin-left: -2.4px;
        margin-top: -8.33333333px;
        width: 5px;
        height: 35px;
        transform: translateY(-300px);
        backface-visibility: hidden;
        animation: in 500ms 6s ease-out forwards;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      .cake:after,
      .cake:before {
        background: rgba(255, 102, 0, 0.6);
        content: "";
        position: absolute;
        width: 100%;
        height: 2.22222222px;
      }
      .cake:after { top: 25%; left: 0; }
      .cake:before { top: 45%; left: 0; }

      /* ============================================== Fire */
      .fuego {
        border-radius: 100%;
        position: absolute;
        top: -20px;
        left: 50%;
        margin-left: -2.6px;
        width: 6.66666667px;
        height: 18px;
      }
      .fuego:nth-child(1) { animation: fuego 2s 6.5s infinite; }
      .fuego:nth-child(2) { animation: fuego 1.5s 6.5s infinite; }
      .fuego:nth-child(3) { animation: fuego 1s 6.5s infinite; }
      .fuego:nth-child(4) { animation: fuego 0.5s 6.5s infinite; }
      .fuego:nth-child(5) { animation: fuego 0.2s 6.5s infinite; }

      @keyframes fuego {
        0%, 100% {
          background: rgba(255, 200, 0, 0.9);
          box-shadow: 0 0 40px 10px rgba(255, 150, 0, 0.7);
          transform: translateY(0) scale(1);
        }
        50% {
          background: rgba(255, 50, 0, 0.5);
          box-shadow: 0 0 40px 20px rgba(255, 100, 0, 0.4);
          transform: translateY(-20px) scale(0);
        }
      }

      @keyframes in { to { transform: translateY(0); } }

      .text {
        color: #ffffff;
        font-family: 'Lemonada', sans-serif;
        font-weight: 600;
        font-style: italic;
        text-align: center;
        background: rgba(0, 0, 0, 0.25); /* خلفية داكنة لزيادة اللمعان */
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 204, 0, 0.5); /* إطار ذهبي */
        border-radius: 20px;
        padding: 25px 35px;
        margin: 20px auto;
        max-width: 85%;
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.4),
          0 0 20px rgba(255, 165, 0, 0.3),
          inset 0 0 15px rgba(255, 255, 255, 0.1);
        animation: glowPulse 2.5s ease-in-out infinite;
      }

      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 140, 0, 0.4); }
        50% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 50px rgba(255, 200, 0, 0.7); border-color: rgba(39, 174, 96, 0.8); }
      }

      .text h1 {
        font-size: 0.9em;
        margin: 0;
        line-height: 1.8;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }

      .divider {
        height: 2px;
        background: linear-gradient(90deg, transparent, #ffcc00, transparent);
        margin: 15px 0;
      }
    </style>
</head>
